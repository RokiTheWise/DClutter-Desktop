[workspace]
resolver = "3"
members = ["crates/dclutter-core", "crates/dclutter-platform", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Dexter Jethro Enriquez"]

# Profiles only take effect at the workspace root.
# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
