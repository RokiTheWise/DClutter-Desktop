[package]
name = "dclutter-platform"
description = "Filesystem access for DClutter: reading folders, filing and recycling files"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
dclutter-core = { path = "../dclutter-core" }
trash = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_RestartManager"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
