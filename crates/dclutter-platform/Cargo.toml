[package]
name = "dclutter-platform"
description = "Filesystem access for DClutter: reading folders and recycling files"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
dclutter-core = { path = "../dclutter-core" }
trash = "5"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
